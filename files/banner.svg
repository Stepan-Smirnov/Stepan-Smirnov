  <text x="80" y="226" fill="#B1BAC4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">async APIs, and distributed systems.</text>
  <text x="80" y="248" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Based in Yaroslavl.</text>

